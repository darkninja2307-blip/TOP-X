<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOP-X Second Hand Dealership</title>
<link rel="icon" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Go Eagles!';src:local('Go Eagles!'),local('GoEagles'),url('/fonts/GoEagles.woff2') format('woff2'),url('/fonts/GoEagles.ttf') format('truetype'),url('/fonts/GoEagles.otf') format('opentype');font-weight:100 900;font-style:normal;font-display:swap}
:root{--dsp:'Go Eagles!','Saira Condensed',sans-serif}
:root{--ink:#060912;--panel:#0d1322;--panel2:#121a30;--line:#1f2a47;--steel:#d5dde8;--mut:#8a96b0;--blue:#2aa8ff;--deep:#0a6cff;--ok:#38e6a0;--bad:#ff5d73;--warn:#ffc14d}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--steel);font:400 16px/1.6 'Hanken Grotesk',sans-serif;min-height:100vh}
h1,h2,h3,.dsp{font-family:var(--dsp);font-weight:800;line-height:1.02;letter-spacing:.01em;}
h1{font-size:clamp(44px,8vw,104px)}h2{font-size:clamp(30px,4.5vw,52px)}h3{font-size:24px}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mut{color:var(--mut)}.wrap{width:min(1180px,92vw);margin:0 auto}section{padding:84px 0}
nav{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;padding:10px 4vw;background:rgba(6,9,18,.72);backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid var(--line)}
nav .logo{display:flex;align-items:center;gap:10px;margin-right:auto;font:800 26px var(--dsp);}
nav .logo img{height:40px;width:48px;object-fit:contain}
nav a.l{padding:8px 14px;border-radius:99px;font-size:14px;color:var(--mut);transition:.2s}
nav a.l:hover,nav a.l.on{color:#fff;background:var(--panel2)}
nav .pill{background:var(--blue);color:#021226;font-weight:700;padding:8px 16px;border-radius:99px;font-size:14px}
.cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--blue);color:#021226;font-size:11px;font-weight:700;margin-left:4px}
.btn{display:inline-block;border:0;cursor:pointer;background:linear-gradient(135deg,var(--blue),var(--deep));color:#fff;font-weight:700;padding:12px 24px;border-radius:10px;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(42,168,255,.3)}.btn:disabled{opacity:.4;pointer-events:none}
.btn.g{background:transparent;border:1px solid var(--line);color:var(--steel)}.btn.g:hover{border-color:var(--blue);box-shadow:none}.btn.s{padding:6px 12px;font-size:13px}
.hero{position:relative;min-height:92vh;display:grid;align-items:end;padding:0 0 70px;overflow:hidden}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,18,.2),var(--ink) 96%),radial-gradient(60% 50% at 80% 20%,rgba(10,108,255,.25),transparent)}
.hero .wrap{position:relative;z-index:1}.hero p{max-width:520px;margin:20px 0 28px;font-size:18px;color:#b8c3d8}
.hero .row{display:flex;gap:12px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:16px;background:var(--panel);margin-top:-36px;position:relative;z-index:2}
.stats div{padding:22px;border-right:1px solid var(--line)}.stats div:last-child{border:0}.stats b{display:block;font:800 40px var(--dsp);color:#fff}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:30px;flex-wrap:wrap}.head p{max-width:440px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.25s;position:relative}
.card:hover{border-color:var(--blue);transform:translateY(-4px)}
.card .im{aspect-ratio:16/10;background:#0a1020 center/cover}.card .bd{padding:16px}
.card .top{display:flex;justify-content:space-between;align-items:start;gap:10px}.price{font:800 24px var(--dsp);color:var(--blue)}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;border:1px solid var(--line);color:var(--mut)}
.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.bad{color:var(--bad);border-color:var(--bad)}
.ic{position:absolute;top:10px;width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;background:rgba(6,9,18,.75);backdrop-filter:blur(6px);display:grid;place-items:center;font-size:16px}
.ic.h{right:10px}.ic.c{right:50px;font-size:12px;font-weight:700}.ic.on{background:var(--blue);color:#021226}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;align-items:center}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;width:100%}
.tools input[type=search]{flex:1;min-width:200px;width:auto}.tools select{width:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.chips button{background:none;border:1px solid var(--line);border-radius:99px;padding:6px 16px;cursor:pointer;color:var(--mut)}
.chips button.on{background:var(--blue);border-color:var(--blue);color:#021226;font-weight:700}
.det{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;padding-top:30px}.det .im{aspect-ratio:16/10;border-radius:16px;background:#0a1020 center/cover;border:1px solid var(--line)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.spec div{padding:12px;background:var(--panel2);border-radius:10px}.spec b{display:block;font-size:18px;color:#fff}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--deep),var(--blue));transition:width 1s cubic-bezier(.2,.8,.2,1)}
.fin label{margin-top:12px}.fin output{font:800 36px var(--dsp);color:var(--blue)}
label{display:grid;gap:5px;font-size:14px;color:var(--mut)}form.f{display:grid;gap:14px;max-width:560px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.steps .box b{font:800 44px var(--dsp);color:var(--blue)}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
details{border-bottom:1px solid var(--line);padding:16px 0}summary{cursor:pointer;font-weight:700;color:#fff}details p{color:var(--mut);margin-top:8px;max-width:720px}
.cta{background:linear-gradient(135deg,#0a2a5c,#0a1226);border:1px solid var(--line);border-radius:22px;padding:56px;display:flex;justify-content:space-between;gap:24px;align-items:center;flex-wrap:wrap}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--mut);font-size:14px}footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:500;font-size:13px}.tw{overflow-x:auto}
.badge{padding:2px 10px;border-radius:99px;font-size:12px;border:1px solid}.Pending{color:var(--warn)}.Approved,.Completed{color:var(--ok)}.Rejected{color:var(--bad)}
.track{display:flex;margin:24px 0}.track div{flex:1;text-align:center;padding-top:14px;position:relative;color:var(--mut);font-size:14px}
.track div:before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--line)}.track div.on{color:#fff}.track div.on:before{background:var(--blue)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:14px;margin:18px 0}
.kp .box{padding:18px;min-width:0;overflow:hidden}.kp .box span{display:block;font-size:14px;line-height:1.3;min-height:2.6em}
.kp .box b{display:block;margin-top:6px;font:800 clamp(24px,2.4vw,34px)/1.1 var(--dsp);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp .box.wide{grid-column:span 2}
@media(max-width:600px){.kp .box.wide{grid-column:span 1}}
.btn.del{background:#3a1220;border:1px solid var(--bad);color:#ff9aa8}.btn.del:hover{background:var(--bad);color:#fff}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
dialog{background:var(--ink);color:var(--steel);border:1px solid var(--line);border-radius:16px;padding:0;width:min(560px,94vw)}dialog::backdrop{background:rgba(0,0,0,.7)}dialog form{padding:24px;max-width:none}
#toasts{position:fixed;bottom:20px;right:20px;z-index:99;display:grid;gap:8px}.toast{background:var(--panel2);border:1px solid var(--blue);padding:12px 18px;border-radius:10px}.toast.e{border-color:var(--bad)}
html.hc,html.hc *{cursor:none!important}html.hc dialog,html.hc dialog *{cursor:auto!important}
#cc{position:fixed;width:56px;pointer-events:none;z-index:98;transform:translate(-50%,-50%);display:none}@media(hover:hover) and (pointer:fine){#cc.show{display:block}}
.nu{display:flex;align-items:center;gap:8px;margin-left:8px;font-size:14px}.nu img{width:30px;height:30px;border-radius:50%}
nav.out a.l,nav.out .pill{display:none}
.dsc{display:inline-flex;align-items:center;gap:10px;background:#5865f2;color:#fff;font-weight:700;padding:14px 26px;border-radius:12px;transition:.2s}.dsc:hover{background:#4752c4;transform:translateY(-2px)}
.login{min-height:70vh;display:grid;place-items:center;text-align:center}.login .box{max-width:480px;padding:40px}
@media(max-width:800px){.dgrid{grid-template-columns:1fr!important}.det,.steps{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stats div:nth-child(2){border:0}nav a.l.x{display:none}.cta{padding:30px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.hero video{display:none}}
</style></head><body>
<img id="cc" src="/car-cursor.png" alt="">
<nav><a class="logo" href="#/"><img src="/logo.png" alt="">TOP-X</a>
<a class="l" href="#/" data-r="">Home</a><a class="l" href="#/showroom" data-r="showroom">Showroom</a><a class="l x" href="#/compare" data-r="compare">Compare<span class="cnt" id="nc" hidden></span></a><a class="l x" href="#/track" data-r="track">Track booking</a><a class="pill" href="#/book">Pre-book</a><span class="nu" id="nu"></span></nav>
<main id="app"></main>
<footer><div class="wrap"><span>© TOP-X Second Hand Dealership</span><span id="ft"></span></div></footer>
<div id="toasts"></div><dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),app=$('#app'),CATS=['Sedan','SUV','Bike','Sports','Supercar','Luxury','Other'],ST=['Pending','Approved','Rejected','Completed'];
const DISCORD=''; /* paste your Discord invite link here */
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n).toLocaleString('en-US'),img=v=>v.image?(/^https?:/.test(v.image)?e(v.image):'/uploads/'+e(v.image)):'/hero-car.jpg';
const store={get(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch{return[]}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let ME=null,V=[],wish=store.get('tx_w'),cmp=store.get('tx_c');
function toast(m,err){const t=document.createElement('div');t.className='toast'+(err?' e':'');t.textContent=m;$('#toasts').append(t);setTimeout(()=>t.remove(),3200)}
async function api(u,o={}){if(o.body&&!(o.body instanceof FormData)){o.headers={'Content-Type':'application/json'};o.body=JSON.stringify(o.body)}
const r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||'Request failed'),{code:r.status});return d}
const load=async()=>V=await api('/api/vehicles');
const cc=$('#cc');addEventListener('mousemove',ev=>{cc.classList.add('show');if(cc.naturalWidth)document.documentElement.classList.add('hc');cc.style.left=ev.clientX+'px';cc.style.top=ev.clientY+'px'});
function badge(){const n=$('#nc');n.hidden=!cmp.length;n.textContent=cmp.length}
function toggle(list,key,id){const i=list.indexOf(id);if(i>-1)list.splice(i,1);else{if(key==='tx_c'&&list.length>=3)return toast('Compare up to 3 vehicles.',1);list.push(id)}store.set(key,list);badge()}
const reveal=()=>setTimeout(()=>document.querySelectorAll('[data-w]').forEach(i=>i.style.width=i.dataset.w+'%'),60);

/* ---------- router ---------- */
function paintNav(){
 document.querySelector('nav').classList.toggle('out',!ME);
 $('#nu').innerHTML=ME?`<img src="${e(ME.avatar)}" alt=""><span class="x">${e(ME.name)}</span><button class="btn g s" id="lo">Log out</button>`:'';
 $('#ft').innerHTML=ME?`<a href="#/track">Track a booking</a>${ME.is_admin?' · <a href="#/admin">Staff panel</a>':''}`:'';
 if(ME)$('#lo').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});ME=null;location.hash='#/';route()}}
function loginView(cfg){
 const err=new URLSearchParams(location.search).get('auth_error');
 if(err)history.replaceState(null,'',location.pathname+location.hash);
 app.innerHTML=`<section class="wrap login"><div class="box"><img src="/logo.png" alt="" style="height:70px;margin-bottom:12px"><h2>Welcome to TOP-X</h2>
 <p class="mut" style="margin:12px 0 24px">Log in with your Discord account to browse the showroom and reserve a vehicle.</p>
 ${err?`<p style="color:var(--bad);margin-bottom:16px">${e(err)}</p>`:''}
 ${cfg===false?'<p style="color:var(--warn);margin-bottom:16px">Server setup: set DISCORD_CLIENT_ID and DISCORD_CLIENT_SECRET first.</p>':''}
 <a class="dsc" href="/auth/discord">Login with Discord</a></div></section>`}
async function route(){
 const p=(location.hash||'#/').split('/'),r=p[1]||'';scrollTo(0,0);
 try{
  const m=await api('/api/me');ME=m.user;paintNav();
  if(!ME)return loginView(m.discord_configured);
  document.querySelectorAll('nav a[data-r]').forEach(a=>a.classList.toggle('on',a.dataset.r===r));badge();
  if(r==='admin')return adminView();
  await load();
  ({'':home,showroom:()=>showroom(),v:()=>detail(+p[2]),compare:compareView,book:()=>bookView(+p[2]||0),track:()=>trackView(p[2])})[r]?.();
  if(!['','showroom','v','compare','book','track'].includes(r))home();
 }catch(x){if(x.code===401){ME=null;paintNav();return loginView(true)}app.innerHTML=`<section class="wrap"><h2>Server unreachable</h2><p class="mut" style="margin-top:10px">${e(x.message)}. Make sure the Flask app and MySQL are running, then reload.</p></section>`}
}
addEventListener('hashchange',route);

/* ---------- cards ---------- */
const card=v=>`<article class="card" data-id="${v.id}"><div class="im" style="background-image:url('${img(v)}')"></div>
<button class="ic h ${wish.includes(v.id)?'on':''}" data-w="${v.id}" aria-label="Save to wishlist">♥</button><button class="ic c ${cmp.includes(v.id)?'on':''}" data-c="${v.id}" aria-label="Add to compare">VS</button>
<div class="bd"><div class="top"><div><h3>${e(v.name)}</h3><span class="mut">Old owner: ${e(v.seller)||'Not listed'}</span></div><span class="price">${money(v.price)}</span></div>
<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><span class="chip">${e(v.category)}</span>${v.plate_no?`<span class="chip">${e(v.plate_no)}</span>`:''}<span class="chip ${v.upgrade?'ok':''}">${v.upgrade?'Upgraded':'Non-upgraded'}</span><span class="chip ${v.available?'ok':'bad'}">${e(v.status)}</span></div></div></article>`;
function wire(root=document){
 root.querySelectorAll('.card').forEach(c=>c.onclick=ev=>{if(!ev.target.closest('.ic'))location.hash='#/v/'+c.dataset.id});
 root.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{toggle(wish,'tx_w',+b.dataset.w);b.classList.toggle('on')});
 root.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{toggle(cmp,'tx_c',+b.dataset.c);b.classList.toggle('on',cmp.includes(+b.dataset.c))})}

/* ---------- home ---------- */
function home(){
 const av=V.filter(v=>v.available),upg=av.filter(v=>v.upgrade).length,sold=V.filter(v=>v.status==='Sold').length;
 app.innerHTML=`<header class="hero"><video autoplay muted loop playsinline><source src="/racing-bg.mp4" type="video/mp4"></video><div class="wrap">
 <h1>Pre-owned cars.<br>Priced to drive off today.</h1><p>Browse every vehicle on the lot, check the numbers, and reserve yours in under a minute. Our team confirms each booking on Discord.</p>
 <div class="row"><a class="btn" href="#/showroom">Browse the showroom</a><a class="btn g" href="#/book">Reserve a car</a></div></div></header>
 <div class="wrap"><div class="stats"><div><b>${av.length}</b><span class="mut">Vehicles available</span></div><div><b>${upg}</b><span class="mut">Upgraded cars</span></div><div><b>${new Set(av.map(v=>v.category)).size}</b><span class="mut">Model types in stock</span></div><div><b>${sold}</b><span class="mut">Cars sold</span></div></div></div>
 <section class="wrap"><div class="head"><h2>Featured this week</h2><a class="btn g s" href="#/showroom">See all vehicles</a></div>
 <div class="grid">${(V.filter(v=>v.featured&&v.available).concat(av).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3).map(card).join(''))||'<p class="mut">No vehicles listed yet.</p>'}</div></section>
 <section class="wrap"><div class="head"><h2>How booking works</h2><p>Three steps, no paperwork. You will always have a reference code to follow your request.</p></div>
 <div class="steps"><div class="box"><b>1</b><h3>Pick a vehicle</h3><p class="mut">Filter by category and price, save favourites, and compare up to three side by side.</p></div>
 <div class="box"><b>2</b><h3>Send your details</h3><p class="mut">Enter your player name, in-game number and Discord username.</p></div>
 <div class="box"><b>3</b><h3>Get confirmed</h3><p class="mut">Staff approve your booking and contact you on Discord to arrange the handover.</p></div></div></section>
 <section class="wrap"><div class="head"><h2>Why buy from TOP-X</h2></div><div class="why">
 <div class="box"><h3>Fair listed prices</h3><p class="mut">Every price is shown up front with no hidden fees.</p></div><div class="box"><h3>Every class covered</h3><p class="mut">Sports, supercars, SUVs, bikes, sedans and luxury.</p></div>
 <div class="box"><h3>Trackable bookings</h3><p class="mut">Check the status of any reservation with its reference code.</p></div><div class="box"><h3>Staff on Discord</h3><p class="mut">Questions before you book? Message the team directly.</p></div></div></section>
 <section class="wrap"><div class="head"><h2>Common questions</h2></div>
 <details><summary>Does pre-booking cost anything?</summary><p>No. A pre-booking only holds your interest while staff review it. Payment is arranged when the handover is agreed.</p></details>
 <details><summary>How long until I hear back?</summary><p>Most requests are reviewed the same day. Use your reference code on the Track booking page to see the current status.</p></details>
 <details><summary>Can I book more than one vehicle?</summary><p>Yes, but only one active booking per vehicle for each in-game number.</p></details>
 <details><summary>What do the statuses mean?</summary><p>Pending means we received it. Approved means it is reserved for you. Completed means the handover is done. Rejected means it could not be accepted.</p></details></section>
 <section class="wrap"><div class="cta"><div><h2>Ready to drive something new?</h2><p class="mut" style="margin-top:8px">Reserve now and we will message you on Discord.</p></div><div style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn" href="#/book">Reserve a car</a>${DISCORD?`<a class="btn g" href="${e(DISCORD)}" target="_blank" rel="noopener">Join our Discord</a>`:''}</div></div></section>`;wire()}

/* ---------- showroom ---------- */
function showroom(){
 const F={q:'',cat:'',sort:'featured',max:0,saved:false},top=Math.max(1,...V.map(v=>v.price));F.max=top;
 app.innerHTML=`<section class="wrap"><div class="head"><h2>Showroom</h2><p id="rc" class="mut"></p></div>
 <div class="chips" id="ch">${['All',...CATS].map(c=>`<button data-c="${c==='All'?'':c}" class="${c==='All'?'on':''}">${c}</button>`).join('')}</div>
 <div class="tools"><input type="search" id="q" placeholder="Search name, plate, model or old owner" aria-label="Search vehicles"><select id="so" aria-label="Sort"><option value="featured">Featured first</option><option value="price_asc">Price: low to high</option><option value="price_desc">Price: high to low</option><option value="name">Name A–Z</option></select>
 <label style="display:flex;align-items:center;gap:8px;grid-auto-flow:column">Max price <input type="range" id="mx" min="0" max="${top}" step="1000" value="${top}" style="width:140px;padding:0"><span id="mv">${money(top)}</span></label>
 <button class="btn g s" id="sv">♥ Saved</button><a class="btn g s" href="#/compare">Compare</a></div><div class="grid" id="gr"></div></section>`;
 const draw=()=>{let l=V.filter(v=>(!F.cat||v.category===F.cat)&&v.price<=F.max&&(!F.saved||wish.includes(v.id))&&[v.name,v.plate_no,v.category,v.seller].join(' ').toLowerCase().includes(F.q));
  const S={featured:(a,b)=>b.featured-a.featured,price_asc:(a,b)=>a.price-b.price,price_desc:(a,b)=>b.price-a.price,name:(a,b)=>a.name.localeCompare(b.name)};l.sort(S[F.sort]);
  $('#rc').textContent=l.length+' vehicle'+(l.length===1?'':'s')+' match your filters';
  $('#gr').innerHTML=l.map(card).join('')||'<p class="mut">Nothing matches. Try clearing the search or raising the max price.</p>';wire($('#gr'))};
 $('#q').oninput=ev=>{F.q=ev.target.value.toLowerCase().trim();draw()};$('#so').onchange=ev=>{F.sort=ev.target.value;draw()};
 $('#mx').oninput=ev=>{F.max=+ev.target.value;$('#mv').textContent=money(F.max);draw()};

/* ---------- detail ---------- */
function detail(id){
 const v=V.find(x=>x.id===id);if(!v){app.innerHTML='<section class="wrap"><h2>Vehicle not found</h2><a class="btn" href="#/showroom" style="margin-top:16px">Back to showroom</a></section>';return}
 const mxP=Math.max(...V.map(x=>x.price),1),sim=V.filter(x=>x.category===v.category&&x.id!==v.id).slice(0,3);
 app.innerHTML=`<div class="wrap"><a href="#/showroom" class="mut" style="display:inline-block;padding-top:24px">← Back to showroom</a>
 <div class="det"><div><div class="im" style="background-image:url('${img(v)}')"></div><div class="box" style="margin-top:20px"><h3>About this vehicle</h3><p class="mut" style="margin-top:8px">${e(v.description)||'No description has been added yet.'}</p></div>
 </div>
 <div><div class="box"><span class="chip ${v.available?'ok':'bad'}">${e(v.status)}</span><h1 style="font-size:52px;margin-top:10px">${e(v.name)}</h1><p class="mut">${e(v.category)}</p><div class="price" style="font-size:40px;margin:10px 0">${money(v.price)}</div>
 <div class="spec"><div><span class="mut">Model</span><b>${e(v.category)}</b></div><div><span class="mut">Upgrade</span><b>${v.upgrade?'Upgraded':'Non-upgraded'}</b></div><div><span class="mut">Number plate</span><b>${e(v.plate_no)||'Not listed'}</b></div><div><span class="mut">Old owner (seller)</span><b>${e(v.seller)||'Not listed'}</b></div></div>
 <span class="mut">Price vs showroom highest</span><div class="bar"><i data-w="${v.price/mxP*100}"></i></div>
 <a class="btn" style="display:block;text-align:center${v.available?'':';pointer-events:none;opacity:.4'}" href="#/book/${v.id}">Pre-book this vehicle</a>
 <div style="display:flex;gap:10px;margin-top:10px"><button class="btn g" style="flex:1" id="dw">${wish.includes(v.id)?'Saved ♥':'Save ♥'}</button><button class="btn g" style="flex:1" id="dc">${cmp.includes(v.id)?'In compare':'Add to compare'}</button></div>
 <button class="btn g" style="width:100%;margin-top:10px" id="sh">Copy link to share</button></div></div></div>
 ${sim.length?`<section style="padding:50px 0"><h2 style="margin-bottom:20px">More ${e(v.category)}</h2><div class="grid">${sim.map(card).join('')}</div></section>`:''}</div>`;

 $('#dw').onclick=ev=>{toggle(wish,'tx_w',v.id);ev.target.textContent=wish.includes(v.id)?'Saved ♥':'Save ♥'};
 $('#dc').onclick=ev=>{toggle(cmp,'tx_c',v.id);ev.target.textContent=cmp.includes(v.id)?'In compare':'Add to compare'};
 $('#sh').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);toast('Link copied')}catch{toast('Copy the address bar link instead.',1)}};wire();reveal()}

/* ---------- compare ---------- */

 ${[['Model',v=>e(v.category)],['Plate',v=>e(v.plate_no)||'-'],['Upgrade',v=>v.upgrade?'Upgraded':'Non-upgraded'],['Old owner',v=>e(v.seller)||'-'],['Price',v=>money(v.price)],['Status',v=>e(v.status)]].map(([k,f])=>`<tr><th>${k}</th>${l.map(v=>`<td>${f(v)}</td>`).join('')}</tr>`).join('')}
 <tr><th></th>${l.map(v=>`<td><a class="btn s" href="#/book/${v.id}">Pre-book</a></td>`).join('')}</tr></table></div>`)+'</section>';

/* ---------- booking + tracking ---------- */
function bookView(pre){
 const av=V.filter(v=>v.available);
 app.innerHTML=`<section class="wrap"><div class="head"><h2>Reserve your vehicle</h2><p>Staff will review your request and contact you on Discord.</p></div>
 <form class="f box" id="bf"><label>Vehicle<select name="vehicle_id" required><option value="">Choose a vehicle</option>${av.map(v=>`<option value="${v.id}" ${v.id===pre?'selected':''}>${e(v.name)} · ${money(v.price)}</option>`).join('')}</select></label>
 <label>Player name<input name="player_name" required minlength="2" maxlength="60" autocomplete="name"></label>
 <label>In-game number<input name="player_id" required inputmode="numeric" pattern="\\d{1,10}" title="Numbers only, up to 10 digits"></label>
 <label>Discord account<input value="${e(ME.username)}" disabled></label>
 <label>Message (optional)<textarea name="message" rows="3" maxlength="500" placeholder="Preferred handover time, questions, special requests"></textarea></label>
 <label style="display:flex;gap:10px;align-items:center;grid-auto-flow:column;justify-content:start"><input type="checkbox" required style="width:auto"> My details are correct.</label>
 <button class="btn">Send booking request</button></form></section>`;
 $('#bf').onsubmit=async ev=>{ev.preventDefault();const b=ev.target.querySelector('button');b.disabled=true;
  try{const d=await api('/api/bookings',{method:'POST',body:Object.fromEntries(new FormData(ev.target))});
   app.innerHTML=`<section class="wrap" style="max-width:640px"><h2>Booking sent</h2><p class="mut" style="margin:12px 0">Save this reference code. You need it to check your status.</p><div class="box"><span class="mut">Reference</span><div class="dsp" style="font-size:48px;color:var(--blue)" id="rf">${e(d.ref)}</div></div>
   <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap"><a class="btn" href="#/track/${e(d.ref)}">Track this booking</a><button class="btn g" id="cp">Copy code</button></div></section>`;
   $('#cp').onclick=()=>navigator.clipboard?.writeText(d.ref).then(()=>toast('Code copied'))}catch(x){toast(x.message,1);b.disabled=false}}}
async function trackView(ref){
 app.innerHTML=`<section class="wrap" style="max-width:720px"><div class="head"><h2>Track a booking</h2></div><form class="f" id="tf" style="max-width:none;grid-template-columns:1fr auto"><input name="ref" placeholder="Reference, e.g. BK-A1B2C3" value="${e(ref||'')}" required aria-label="Booking reference"><button class="btn">Check status</button></form><div id="tr"></div></section>`;
 const go=async r=>{try{const d=await api('/api/bookings/'+encodeURIComponent(r)),flow=['Pending','Approved','Completed'],i=flow.indexOf(d.status);
  $('#tr').innerHTML=`<div class="box" style="margin-top:20px"><span class="mut">${e(d.ref)}</span><h3 style="margin:4px 0">${e(d.vehicle)}</h3><p class="mut">Requested by ${e(d.player_name)} on ${new Date(d.created_at).toLocaleDateString()}</p>
  ${d.status==='Rejected'?'<p class="badge Rejected" style="display:inline-block;margin-top:14px">Rejected. Contact staff on Discord for details.</p>':`<div class="track">${flow.map((s,k)=>`<div class="${k<=i?'on':''}">${s}</div>`).join('')}</div>`}</div>`}catch(x){$('#tr').innerHTML=`<p class="mut" style="margin-top:20px">${e(x.message)} Check the code and try again.</p>`}};
 $('#tf').onsubmit=ev=>{ev.preventDefault();go(new FormData(ev.target).get('ref'))};ref&&go(ref)}

/* ---------- admin ---------- */
const upg=v=>v.upgrade?'Upgraded':'Non-upgraded';
async function adminView(){
 if(!ME.is_admin){app.innerHTML=`<section class="wrap"><div class="box" style="max-width:560px"><h2>Staff only</h2><p class="mut" style="margin-top:10px">Your Discord account (<b>${e(ME.username)}</b>) is not an admin. Ask the owner to run:</p><p class="box" style="margin-top:12px;font-family:monospace">flask make-admin ${e(ME.discord_id)}</p></div></section>`;return}
 app.innerHTML=`<section class="wrap"><div class="tabs"><button class="btn g s" data-t="dash">Dashboard</button><button class="btn g s" data-t="veh">Vehicles</button><button class="btn g s" data-t="sales">Sales log</button><button class="btn g s" data-t="bk">Bookings</button></div><div id="at"></div></section>`;
 const T={dash,veh,sales,bk};document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>T[b.dataset.t]());dash()}
const guard=f=>async(...a)=>{try{return await f(...a)}catch(x){x.code===401?route():toast(x.message,1)}};
const dash=guard(async()=>{const s=await api('/api/admin/stats'),L=await api('/api/admin/sales'),rev=L.reduce((a,x)=>a+x.sold_amount,0),pro=L.reduce((a,x)=>a+x.sold_amount-x.purchase_price,0),mx=Math.max(...s.popular.map(p=>p.n),1);
 $('#at').innerHTML=`<div class="kp">${[['Vehicles',s.vehicles],['In stock',s.in_stock],['Cars sold',s.sold],['Pending bookings',s.pending],['Discord users',s.users],['Sales revenue',money(rev)],['Profit',money(pro)]].map(([l,n],i)=>`<div class="box${i>4?' wide':''}"><span class="mut">${l}</span><b title="${n}">${n}</b></div>`).join('')}</div>
 <div class="steps dgrid"><div class="box"><h3>Most booked</h3>${s.popular.map(p=>`<div style="margin-top:12px">${e(p.name)} <span class="mut">${p.n}</span><div class="bar"><i data-w="${p.n/mx*100}"></i></div></div>`).join('')||'<p class="mut">No bookings yet.</p>'}</div>
 <div class="box"><h3>Recent activity</h3>${s.recent.map(r=>`<p style="margin-top:10px">${e(r.player_name)} · ${e(r.vehicle)} <span class="badge ${r.status}">${r.status}</span></p>`).join('')||'<p class="mut">No bookings yet.</p>'}</div></div>`;reveal()});

/* vehicles CRUD */
let AV=[];
const veh=guard(async()=>{AV=await api('/api/admin/vehicles');
 $('#at').innerHTML=`<button class="btn s" id="nv" style="margin-bottom:14px">Add vehicle</button><div class="box tw"><table><tr><th>Vehicle</th><th>Model</th><th>Plate</th><th>Upgrade</th><th>Old owner</th><th>Dealer (bought)</th><th>Purchase</th><th>Listing price</th><th>Status</th><th>Actions</th></tr>${AV.map(v=>`<tr><td>${e(v.name)}</td><td>${e(v.category)}</td><td>${e(v.plate_no)||'-'}</td><td>${upg(v)}</td><td>${e(v.seller)||'-'}</td><td>${e(v.dealer)||'-'}</td><td>${money(v.purchase_price)}</td><td>${money(v.price)}</td><td><span class="badge ${v.status==='Sold'?'Rejected':'Approved'}">${e(v.status)}</span></td><td style="white-space:nowrap">
 <button class="btn g s" data-e="${v.id}">Edit</button> ${v.status==='Sold'?`<button class="btn g s" data-r="${v.id}">Relist</button>`:`<button class="btn s" data-s="${v.id}">Mark sold</button>`} <button class="btn s del" data-d="${v.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="10" class="mut">No vehicles yet. Add your first one.</td></tr>'}</table></div>`;
 $('#nv').onclick=()=>vform();document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>vform(AV.find(v=>v.id==b.dataset.e)));
 document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>sellForm(AV.find(v=>v.id==b.dataset.s)));
 document.querySelectorAll('[data-r]').forEach(b=>b.onclick=guard(async()=>{if(!confirm('Put this vehicle back in stock? The sales-log entry is kept (delete it from the Sales log if the sale was cancelled).'))return;await api(`/api/admin/vehicles/${b.dataset.r}/relist`,{method:'POST'});toast('Vehicle relisted');veh()}));
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=guard(async()=>{if(!confirm('Delete this vehicle and its bookings? Sales log entries are kept.'))return;await api('/api/admin/vehicles/'+b.dataset.d,{method:'DELETE'});toast('Vehicle deleted');veh()}))});
const FLD=[['name','Vehicle name','text'],['category','Model type','sel'],['plate_no','Plate number','text'],['upgrade','Upgrade','upg'],['seller','Car seller (old owner)','text'],['dealer','Dealer who bought the car','text'],['purchase_price','Purchase amount ($)','number'],['price','Listing / selling price ($)','number']];
function vform(v={}){const d=$('#dlg');
 d.innerHTML=`<form class="f" id="vf"><h2 style="font-size:34px">${v.id?'Edit':'Add'} vehicle</h2>${FLD.map(([k,l,t])=>`<label>${l}${t==='sel'?`<select name="${k}">${CATS.map(c=>`<option ${v[k]===c?'selected':''}>${c}</option>`).join('')}</select>`:t==='upg'?`<select name="${k}"><option value="0" ${v.upgrade?'':'selected'}>Non-upgraded</option><option value="1" ${v.upgrade?'selected':''}>Upgraded</option></select>`:`<input name="${k}" type="${t}" ${t==='number'?'min="0"':''} value="${e(v[k])}" required>`}</label>`).join('')}
 <label>Description (optional)<textarea name="description" rows="3">${e(v.description)}</textarea></label><label>Image<input name="image" type="file" accept="image/*"></label>
 <label style="display:flex;gap:8px;grid-auto-flow:column;justify-content:start"><input type="checkbox" name="featured" style="width:auto" ${v.featured?'checked':''}> Featured on home page</label>
 <div style="display:flex;gap:10px"><button class="btn">Save vehicle</button><button type="button" class="btn g" id="cx">Cancel</button></div></form>`;d.showModal();$('#cx').onclick=()=>d.close();
 $('#vf').onsubmit=guard(async ev=>{ev.preventDefault();const fd=new FormData(ev.target);fd.set('featured',ev.target.featured.checked?'1':'0');
  await api('/api/admin/vehicles'+(v.id?'/'+v.id:''),{method:v.id?'PUT':'POST',body:fd});d.close();toast('Vehicle saved');veh()})}

/* mark as sold -> asks for sale details and writes the full sales log */
function sellForm(v){const d=$('#dlg');
 d.innerHTML=`<form class="f" id="sf"><h2 style="font-size:34px">Mark as sold</h2>
 <div class="box" style="padding:14px"><b style="color:#fff">${e(v.name)}</b> · ${e(v.category)} · ${e(v.plate_no)} · ${upg(v)}<div class="mut" style="font-size:13px">Old owner: ${e(v.seller)} · Bought by dealer: ${e(v.dealer)} · Purchase: ${money(v.purchase_price)}</div></div>
 <label>Customer name<input name="customer" required maxlength="80"></label><label>Dealer who sold the car<input name="sell_dealer" required maxlength="80" value="${e(ME.name)}"></label>
 <label>Sold to customer amount ($)<input name="sold_amount" type="number" min="0" required value="${v.price}"></label><label>Note (optional)<input name="note" maxlength="500"></label>
 <div style="display:flex;gap:10px"><button class="btn">Confirm sale</button><button type="button" class="btn g" id="cx">Cancel</button></div></form>`;d.showModal();$('#cx').onclick=()=>d.close();
 $('#sf').onsubmit=guard(async ev=>{ev.preventDefault();await api(`/api/admin/vehicles/${v.id}/sell`,{method:'POST',body:Object.fromEntries(new FormData(ev.target))});d.close();toast('Sold and logged');veh()})}

/* sales log */
const sales=guard(async()=>{const L=await api('/api/admin/sales');
 $('#at').innerHTML=`<div class="tools"><input type="search" id="sq" placeholder="Search vehicle, plate, old owner, dealer, customer"><button class="btn g s" id="ex">Export CSV</button></div><div class="box tw" id="st"></div>`;
 const draw=()=>{const t=$('#sq').value.toLowerCase(),l=L.filter(x=>[x.vehicle_name,x.plate_no,x.seller,x.buy_dealer,x.sell_dealer,x.customer].join(' ').toLowerCase().includes(t)),
  P=l.reduce((a,x)=>a+x.purchase_price,0),S=l.reduce((a,x)=>a+x.sold_amount,0);
  $('#st').innerHTML=`<table><tr><th>Date</th><th>Vehicle</th><th>Plate</th><th>Old owner</th><th>Bought by dealer</th><th>Purchase</th><th>Customer</th><th>Sold by dealer</th><th>Sold amount</th><th>Profit</th><th></th></tr>${l.map(x=>{const p=x.sold_amount-x.purchase_price;return `<tr><td>${new Date(x.created_at).toLocaleDateString()}</td><td>${e(x.vehicle_name)}<div class="mut" style="font-size:13px">${e(x.model_type)} · ${x.upgrade?'Upgraded':'Non-upgraded'}${x.note?' · '+e(x.note):''}</div></td><td>${e(x.plate_no)||'-'}</td><td>${e(x.seller)||'-'}</td><td>${e(x.buy_dealer)||'-'}</td><td>${money(x.purchase_price)}</td><td>${e(x.customer)}</td><td>${e(x.sell_dealer)||'-'}</td><td>${money(x.sold_amount)}</td><td class="${p<0?'Rejected':'Approved'}">${money(p)}</td><td style="white-space:nowrap"><button class="btn g s" data-se="${x.id}">Edit</button> <button class="btn s del" data-sd="${x.id}">Delete</button></td></tr>`}).join('')||'<tr><td colspan="11" class="mut">No sales yet. Use "Mark sold" on a vehicle in the Vehicles tab.</td></tr>'}
  ${l.length?`<tr><th colspan="5">Totals (${l.length} sales)</th><th>${money(P)}</th><th></th><th></th><th>${money(S)}</th><th>${money(S-P)}</th><th></th></tr>`:''}</table>`;
  document.querySelectorAll('[data-se]').forEach(b=>b.onclick=()=>saleEdit(L.find(x=>x.id==b.dataset.se)));
  document.querySelectorAll('[data-sd]').forEach(b=>b.onclick=guard(async()=>{if(!confirm('Delete this sale record?'))return;await api('/api/admin/sales/'+b.dataset.sd,{method:'DELETE'});toast('Sale deleted');sales()}))};
 $('#sq').oninput=draw;draw();
 $('#ex').onclick=()=>{const h=['Date','Vehicle','Model','Plate','Upgrade','Old owner','Bought by dealer','Purchase','Customer','Sold by dealer','Sold amount','Profit','Logged by'],c=x=>'"'+String(x??'').replace(/"/g,'""')+'"',
  rows=L.map(x=>[new Date(x.created_at).toLocaleDateString(),x.vehicle_name,x.model_type,x.plate_no,x.upgrade?'Upgraded':'Non-upgraded',x.seller,x.buy_dealer,x.purchase_price,x.customer,x.sell_dealer,x.sold_amount,x.sold_amount-x.purchase_price,x.logged_by].map(c).join(','));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([[h.join(',')].concat(rows).join('\n')],{type:'text/csv'}));a.download='topx-sales-log.csv';a.click()}});
function saleEdit(x){const d=$('#dlg');
 d.innerHTML=`<form class="f" id="sf"><h2 style="font-size:34px">Edit sale</h2><p class="mut">${e(x.vehicle_name)} · ${e(x.plate_no)}</p>
 <label>Customer name<input name="customer" required value="${e(x.customer)}"></label><label>Dealer who sold the car<input name="sell_dealer" required value="${e(x.sell_dealer)}"></label>
 <label>Sold amount ($)<input name="sold_amount" type="number" min="0" required value="${x.sold_amount}"></label><label>Note<input name="note" value="${e(x.note)}"></label>
 <div style="display:flex;gap:10px"><button class="btn">Save</button><button type="button" class="btn g" id="cx">Cancel</button></div></form>`;d.showModal();$('#cx').onclick=()=>d.close();
 $('#sf').onsubmit=guard(async ev=>{ev.preventDefault();await api('/api/admin/sales/'+x.id,{method:'PUT',body:Object.fromEntries(new FormData(ev.target))});d.close();toast('Sale updated');sales()})}

/* bookings */
const bk=guard(async()=>{const B=await api('/api/admin/bookings');
 $('#at').innerHTML=`<div class="tools"><input type="search" id="bq" placeholder="Search reference, player, Discord, vehicle"><select id="bs"><option value="">All statuses</option>${ST.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="box tw" id="bt"></div>`;
 const draw=()=>{const t=$('#bq').value.toLowerCase(),s=$('#bs').value,l=B.filter(b=>(!s||b.status===s)&&[b.ref,b.player_name,b.discord,b.vehicle,b.player_id].join(' ').toLowerCase().includes(t));

  document.querySelectorAll('[data-b]').forEach(x=>x.onclick=guard(async()=>{await api('/api/admin/bookings/'+x.dataset.b,{method:'PATCH',body:{status:x.dataset.s}});toast('Booking '+x.dataset.s.toLowerCase());bk()}));document.querySelectorAll('[data-bd]').forEach(x=>x.onclick=guard(async()=>{if(!confirm('Delete this booking?'))return;await api('/api/admin/bookings/'+x.dataset.bd,{method:'DELETE'});toast('Booking deleted');bk()}))};
 $('#bq').oninput=draw;$('#bs').onchange=draw;draw()});
route();
</script></body></html>
